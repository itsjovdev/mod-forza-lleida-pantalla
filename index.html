<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOD · Cub Forza Lleida</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
      #stage { position: relative; width: 100vw; aspect-ratio: 4608 / 640; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #guides { position: absolute; inset: 0; pointer-events: none; display: none; }
      #guides.on { display: block; }
      #guides div {
        position: absolute; top: 0; bottom: 0; box-sizing: border-box;
        border-left: 2px dashed rgba(255, 80, 80, .9);
        font: 600 14px/1.2 system-ui, sans-serif; color: #ff5050; padding: 4px 6px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="guides"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
